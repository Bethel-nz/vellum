name: Windows

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare screenshot output directory
        run: New-Item -ItemType Directory -Force screenshots
      - run: bun install --frozen-lockfile
      - run: cargo install cargo-packager --locked --version 0.11.8
      - run: bun test ./core
      - run: bun run typecheck
      - run: bun scripts/check-windows.ts
      - run: bun scripts/check-bridge.ts
      - run: bun scripts/check-settings.ts
      - run: bun scripts/check-tabs.ts
      - run: bun scripts/check-terminals.ts
      - run: bun run package
      - run: bun scripts/check-app.ts
      - uses: actions/upload-artifact@v4
        with:
          name: vellum-windows-x64-installer
          path: dist/bundle/*.exe
          if-no-files-found: error
