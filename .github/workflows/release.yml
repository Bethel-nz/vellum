name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag matching package.json (for example v1.0.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'core' || github.ref }}
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Validate release version and commit
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          bun -e '
            const tag = process.env.RELEASE_TAG;
            if (!/^v[0-9]+[.][0-9]+[.][0-9]+(?:-[0-9A-Za-z.-]+)?(?:[+][0-9A-Za-z.-]+)?$/.test(tag)) throw new Error("Invalid release tag");
          '
          if git rev-parse --verify "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            git checkout --detach "refs/tags/${RELEASE_TAG}^{commit}"
          fi
          bun -e '
            const version = (await Bun.file("package.json").json()).version;
            if (process.env.RELEASE_TAG !== `v${version}`) throw new Error(`Release tag must be v${version}`);
            for (const file of ["packager.json", "packager.windows.json", "extension/package.json"]) {
              if ((await Bun.file(file).json()).version !== version) throw new Error(`Version mismatch in ${file}`);
            }
            const manifest = await Bun.file("extension/manifest.json").json();
            if (manifest.version !== version.split(/[-+]/)[0]) throw new Error("Extension manifest version mismatch");
          '
          git merge-base --is-ancestor HEAD origin/core
          commit=$(git rev-parse HEAD)
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    uses: ./.github/workflows/desktop.yml
    with:
      ref: ${{ needs.prepare.outputs.commit }}

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vellum-*
          merge-multiple: true
          path: release
      - name: Publish desktop and Chrome extension downloads
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          windows="release/Vellum_${version}_x64-setup.exe"
          macos="release/Vellum_${version}_macos-arm64.zip"
          extension="release/Vellum_Snapshot_${version}_chrome.zip"
          test -s "$windows"
          test -s "$macos"
          test -s "$extension"
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > release-state.txt 2>/dev/null; then
            if [ "$(cat release-state.txt)" != true ]; then
              echo "Release already published; leaving its assets unchanged."
              exit 0
            fi
            target=$(gh release view "$RELEASE_TAG" --json targetCommitish --jq '.targetCommitish')
            if [ "$target" != "$RELEASE_COMMIT" ]; then
              echo 'Existing draft targets a different commit; refusing to change it.' >&2
              exit 1
            fi
          else
            flags=()
            release_version=${RELEASE_TAG%%+*}
            if [[ "$release_version" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --target "$RELEASE_COMMIT" --title "Vellum $RELEASE_TAG" --generate-notes --draft "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" "$windows" "$macos" "$extension" --clobber
          gh release edit "$RELEASE_TAG" --draft=false
